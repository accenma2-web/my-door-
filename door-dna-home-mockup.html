<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Door — معاينة الشاشة الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#030405;
    --void-2:#0a0704;
    --card-top:#17130c;
    --card-bottom:#08090b;
    --gold:#e8bd57;
    --gold-light:#ffe7a0;
    --gold-mid:#d39a32;
    --gold-deep:#b77a16;
    --border-gold:#8d6b2d;
    --border-gold-light:#f1cc70;
    --cream:#f8f1df;
    --muted:#9da4ae;
    --muted-2:#7f8792;
    --line:#241d10;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, #2a1d09 0%, transparent 60%),
      radial-gradient(ellipse 700px 600px at 90% 100%, #1a1408 0%, transparent 55%),
      var(--void);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'Tajawal',sans-serif;
  }
  .screen{
    width:100%;
    max-width:380px;
    background:linear-gradient(165deg,var(--card-top) 0%,var(--card-bottom) 60%);
    border:1px solid var(--border-gold);
    border-radius:26px;
    padding:28px 22px 26px;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.7),
      0 0 0 1px rgba(241,204,112,.05) inset;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand .word{
    color:var(--gold);
    font-size:19px;
    font-weight:800;
    letter-spacing:3px;
  }
  .brand .rule{
    width:46px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--border-gold-light),transparent);
    margin:10px auto;
  }
  .brand .sub{
    color:var(--muted);
    font-size:12px;
    font-weight:400;
  }
  .progress{
    display:flex;
    gap:6px;
    margin-bottom:24px;
  }
  .progress span{
    flex:1;
    height:3px;
    border-radius:2px;
    background:var(--line);
  }
  .progress span.done{
    background:linear-gradient(90deg,var(--gold-mid),var(--gold-light));
  }
  .label{
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    letter-spacing:.4px;
    margin-bottom:10px;
  }
  .section{margin-bottom:22px}
  .prop-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .prop{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 12px;
    border-radius:13px;
    border:1px solid var(--line);
    background:#0d0f13;
    color:var(--muted);
    font-size:12.5px;
    cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  .prop svg{flex:none;width:18px;height:18px;stroke:var(--muted-2);transition:stroke .15s ease}
  .prop:hover{border-color:var(--border-gold)}
  .prop.active{
    border-color:var(--border-gold-light);
    background:linear-gradient(145deg,rgba(255,231,160,.08),rgba(183,122,22,.05));
    color:var(--cream);
  }
  .prop.active svg{stroke:var(--gold)}
  textarea{
    width:100%;
    min-height:78px;
    resize:none;
    background:#0d0f13;
    border:1px solid var(--line);
    border-radius:13px;
    color:var(--cream);
    font-family:'Tajawal',sans-serif;
    font-size:12.5px;
    line-height:1.8;
    padding:12px 13px;
  }
  textarea::placeholder{color:var(--muted-2)}
  textarea:focus{outline:none;border-color:var(--border-gold-light)}
  .slider-row{margin-bottom:16px}
  .slider-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--muted);
    margin-bottom:7px;
  }
  .slider-head .val{color:var(--gold);font-weight:700}
  .slider-head .name{display:flex;align-items:center;gap:6px}
  .slider-head svg{width:13px;height:13px;stroke:var(--muted-2)}
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:3px;
    border-radius:2px;
    background:var(--line);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold-deep));
    border:1px solid var(--border-gold-light);
    cursor:pointer;
    margin-top:0;
  }
  .concepts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .concept{
    position:relative;
    border-radius:14px;
    border:1px solid var(--line);
    background:#0d0f13;
    padding:14px 10px 12px;
    text-align:center;
    cursor:pointer;
  }
  .concept.best{
    border-color:var(--border-gold-light);
    background:linear-gradient(180deg,rgba(255,231,160,.06),transparent 60%);
  }
  .badge{
    position:absolute;
    top:-9px;
    right:10px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold-mid));
    color:#171006;
    font-size:9.5px;
    font-weight:800;
    padding:3px 9px;
    border-radius:20px;
  }
  .door-icon{margin:2px auto 8px}
  .concept .name{font-size:11.5px;color:var(--muted)}
  .concept.best .name{color:var(--cream)}
  .cta{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:1px solid var(--border-gold-light);
    border-radius:15px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold-mid) 55%,var(--gold-deep));
    color:#171006;
    font-family:'Tajawal',sans-serif;
    font-size:14.5px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 10px 30px -8px rgba(211,154,50,.5);
  }
  .cta svg{width:16px;height:16px;stroke:#171006}
</style>
</head>
<body>

<div class="screen">
  <div class="brand">
    <div class="word">MY DOOR</div>
    <div class="rule"></div>
    <div class="sub">من شخصيتك إلى هوية مدخلك</div>
  </div>

  <div class="progress">
    <span class="done"></span><span class="done"></span><span></span><span></span>
  </div>

  <div class="section">
    <div class="label">نوع العقار</div>
    <div class="prop-grid" id="propGrid">
      <div class="prop active" data-p="villa">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        فيلا
      </div>
      <div class="prop" data-p="apt">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></svg>
        شقة
      </div>
      <div class="prop" data-p="compound">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 8v13h16V8z"/><path d="M9 21v-6h6v6"/></svg>
        كمبوند
      </div>
      <div class="prop" data-p="office">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        مكتب
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label">احكِ لنا قصتك</div>
    <textarea placeholder="مثال: أحب الهدوء والفخامة الهادئة، وأقدّر التفاصيل الدقيقة والحرفية العالية..."></textarea>
  </div>

  <div class="section">
    <div class="slider-row">
      <div class="slider-head">
        <span class="name"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>الخصوصية</span>
        <span class="val" id="v1">72%</span>
      </div>
      <input type="range" min="0" max="100" value="72" oninput="v1.textContent=this.value+'%'">
    </div>
    <div class="slider-row" style="margin-bottom:0">
      <div class="slider-head">
        <span class="name"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>الحضور البصري</span>
        <span class="val" id="v2">55%</span>
      </div>
      <input type="range" min="0" max="100" value="55" oninput="v2.textContent=this.value+'%'">
    </div>
  </div>

  <div class="section" style="margin-bottom:0">
    <div class="label">مفاهيم مقترحة</div>
    <div class="concepts">
      <div class="concept best">
        <div class="badge">الأنسب</div>
        <svg class="door-icon" width="34" height="34" viewBox="0 0 40 44" fill="none">
          <path d="M6 42V14C6 8 12 4 20 4C28 4 34 8 34 14V42" stroke="#e8bd57" stroke-width="1.6"/>
          <line x1="6" y1="42" x2="34" y2="42" stroke="#e8bd57" stroke-width="1.6"/>
          <line x1="20" y1="8" x2="20" y2="42" stroke="#8d6b2d" stroke-width="1"/>
          <circle cx="17" cy="26" r="1.4" fill="#e8bd57"/>
        </svg>
        <div class="name">هدوء مصري معاصر</div>
      </div>
      <div class="concept">
        <svg class="door-icon" width="34" height="34" viewBox="0 0 40 44" fill="none">
          <path d="M6 42V14C6 8 12 4 20 4C28 4 34 8 34 14V42" stroke="#5f5e5a" stroke-width="1.6"/>
          <line x1="6" y1="42" x2="34" y2="42" stroke="#5f5e5a" stroke-width="1.6"/>
          <rect x="12" y="10" width="6" height="10" stroke="#444441" stroke-width="1"/>
          <rect x="22" y="10" width="6" height="10" stroke="#444441" stroke-width="1"/>
          <circle cx="17" cy="26" r="1.4" fill="#888780"/>
        </svg>
        <div class="name">فخامة هادئة</div>
      </div>
    </div>
  </div>

  <button class="cta">
    متابعة
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </button>
</div>

<script>
document.getElementById('propGrid').addEventListener('click', function(e){
  var btn = e.target.closest('.prop');
  if(!btn) return;
  this.querySelectorAll('.prop').forEach(function(p){ p.classList.remove('active') });
  btn.classList.add('active');
});
document.querySelectorAll('.concept').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.concept').forEach(function(x){ x.classList.remove('best'); x.querySelector('.badge')?.remove() });
    c.classList.add('best');
    if(!c.querySelector('.badge')){
      var b=document.createElement('div'); b.className='badge'; b.textContent='الأنسب';
      c.appendChild(b);
    }
  });
});
</script>

</body>
</html>
